<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Folcloria</title>
  <meta name="description" content="Guía oficial del parque temático Folcloria">
  <meta name="theme-color" content="#1f8a4c">

  <!-- iOS: modo app instalada -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Folcloria">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="main" tabindex="-1">

      <!-- 01 INICIO -->
      <section class="view" id="view-inicio" data-title="Inicio"></section>

      <!-- 02 MAPA -->
      <section class="view view-map" id="view-mapa" data-title="Mapa">
        <div class="page-head">
          <h1>Mapa interactivo</h1>
          <p>Pellizca para hacer zoom y toca una zona para descubrirla.</p>
        </div>
        <div class="map-viewport" id="mapViewport">
          <div class="map-stage" id="mapStage"></div>
          <div class="map-controls">
            <button type="button" id="zoomIn" aria-label="Acercar">+</button>
            <button type="button" id="zoomOut" aria-label="Alejar">−</button>
            <button type="button" id="zoomReset" aria-label="Restablecer">⟲</button>
          </div>
        </div>
        <div class="map-legend" id="mapLegend"></div>
      </section>

      <!-- 03 MASCOTA -->
      <section class="view" id="view-mascota" data-title="Nuestra mascota"></section>

      <!-- 04 LEYENDAS -->
      <section class="view" id="view-leyendas" data-title="Leyendas"></section>
      <section class="view" id="view-leyenda" data-title="Leyenda"></section>

      <!-- 05 INFORMACIÓN -->
      <section class="view" id="view-info" data-title="Información"></section>

    </main>

    <!-- Ventana de zona del mapa -->
    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet-handle"></div>
      <button type="button" class="sheet-close" id="sheetClose" aria-label="Cerrar">×</button>
      <div id="sheetBody"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Barra inferior -->
    <nav class="tabbar" id="tabbar" aria-label="Navegación principal">
      <a href="#/inicio" data-tab="inicio"><span class="ti" aria-hidden="true"></span><span>Inicio</span></a>
      <a href="#/mapa" data-tab="mapa"><span class="ti" aria-hidden="true"></span><span>Mapa</span></a>
      <a href="#/leyendas" data-tab="leyendas"><span class="ti" aria-hidden="true"></span><span>Leyendas</span></a>
      <a href="#/info" data-tab="info"><span class="ti" aria-hidden="true"></span><span>Información</span></a>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
